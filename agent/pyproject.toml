[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queryshift-agent"
version = "0.1.0"
description = "Bedrock-powered Strands agents for PostgreSQL diagnostics and SQL modernization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "botocore>=1.34,<2",
  "mcp>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sqlglot>=26,<30",
  "strands-agents>=1.0,<2",
]

[project.scripts]
queryshift-agent = "queryshift_agent.cli:main"
queryshift-modernize = "queryshift_agent.modernize_cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/queryshift_agent"]
