name: "QueryShift database health check"
description: "Read-only PostgreSQL health check for CI. Uploads findings to the Security tab (SARIF) and fails the job on your chosen severity."
branding:
  icon: database
  color: blue

inputs:
  dsn:
    description: "postgres:// DSN. Use a pg_monitor role with NO data access — never a superuser. Pass it from a secret."
    required: true
  fail-on:
    description: "Fail the job on findings at/above this severity: critical | warn | info | none."
    required: false
    default: warn
  format:
    description: "Report format: sarif | json | junit | text."
    required: false
    default: sarif
  config:
    description: "Path to a .queryshift.toml (optional)."
    required: false
    default: ""
  profile:
    description: "full (a live database) | schema (catalog-only, safe on an empty CI database — use for PR checks)."
    required: false
    default: full
  base-report:
    description: "Path to a base queryshift --json report. When set, only findings NOT already in it fail the check (--fail-on-new)."
    required: false
    default: ""
  version:
    description: "queryshift version to install (e.g. v0.2.0), or 'latest'. Ignored if queryshift is already on PATH."
    required: false
    default: latest
  upload-sarif:
    description: "Upload the SARIF report to the Security tab (only when format=sarif). Needs security-events: write."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install queryshift
      shell: bash
      env:
        # 'latest' is the installer's default anyway, so pass it as empty rather
        # than as a literal tag the installer would try to download verbatim.
        QUERYSHIFT_VERSION: ${{ inputs.version != 'latest' && inputs.version || '' }}
      run: |
        if command -v queryshift >/dev/null 2>&1; then
          echo "queryshift already on PATH: $(queryshift --version)"
        else
          # Install where we then add to PATH, so the two agree.
          export QUERYSHIFT_INSTALL_DIR="$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/sarankumar1325/queryshift/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Run queryshift
      id: run
      shell: bash
      env:
        # Via env, not command interpolation, so a special char in the DSN can't
        # break the command line or leak into logs.
        QUERYSHIFT_DSN: ${{ inputs.dsn }}
        QUERYSHIFT_FAIL_ON: ${{ inputs.fail-on }}
        QUERYSHIFT_FORMAT: ${{ inputs.format }}
        QUERYSHIFT_CONFIG_PATH: ${{ inputs.config }}
        QUERYSHIFT_PROFILE: ${{ inputs.profile }}
        QUERYSHIFT_BASE_REPORT: ${{ inputs.base-report }}
      run: |
        out="queryshift-report.${QUERYSHIFT_FORMAT}"
        args=(inspect "$QUERYSHIFT_DSN" --no-store --no-color --format="$QUERYSHIFT_FORMAT" --fail-on="$QUERYSHIFT_FAIL_ON")
        if [ -n "$QUERYSHIFT_CONFIG_PATH" ]; then args+=(--config "$QUERYSHIFT_CONFIG_PATH"); fi
        # Only pass the newer flags when actually used, so the default invocation
        # still works against a queryshift release that predates them (the action
        # installs the binary; --profile/--fail-on-new need queryshift >= 0.3).
        if [ -n "$QUERYSHIFT_PROFILE" ] && [ "$QUERYSHIFT_PROFILE" != "full" ]; then args+=(--profile="$QUERYSHIFT_PROFILE"); fi
        if [ -n "$QUERYSHIFT_BASE_REPORT" ]; then args+=(--fail-on-new "$QUERYSHIFT_BASE_REPORT"); fi
        set +e
        queryshift "${args[@]}" > "$out"
        code=$?
        set -e
        {
          echo "exit-code=$code"
          echo "report-file=$out"
        } >> "$GITHUB_OUTPUT"
        # Show the report in the log for non-SARIF formats (SARIF goes to the
        # Security tab); always surface the exit code.
        if [ "$QUERYSHIFT_FORMAT" != "sarif" ]; then cat "$out"; fi
        echo "queryshift exit code: $code (0 clean · 1 warn · 2 critical · 3 error · 64 usage)"

    - name: Upload SARIF to the Security tab
      if: ${{ inputs.format == 'sarif' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ steps.run.outputs.report-file }}
        category: queryshift

    - name: Enforce --fail-on
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}
